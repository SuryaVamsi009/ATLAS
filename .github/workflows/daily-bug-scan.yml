name: Daily Bug Scan (Pacman)

on:
  schedule:
    # 6:00 AM IST = 12:30 AM UTC (runs before market hours)
    - cron: '30 0 * * 1-5'  # Mon-Fri only
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  bug-scan:
    name: Pacman Bug Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pyyaml

      - name: Run Pacman bug scan
        id: scan
        run: |
          python scripts/daily_bug_scan.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload bug report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacman-bug-report-${{ github.run_id }}
          path: bugs/found/
          if-no-files-found: ignore

  notify:
    name: Notify on Critical Bugs
    needs: bug-scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check for critical bugs
        run: |
          # This would check the scan results and notify if critical bugs found
          echo "Bug scan completed. Check issues for new bugs assigned to Ben."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}